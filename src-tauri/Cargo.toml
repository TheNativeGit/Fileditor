[package]
name = "fileditor"
version = "1.0.2"
description = "Fileditor - Visual File Editor"
authors = ["NativeProduction"]
license = "MIT"
homepage = "https://nativeproduction.de"
repository = "https://github.com/TheNativeGit/Fileditor"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "Fileditor"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rfd = "0.15"
uppsala = "0.4.0"
chrono = "0.4"
